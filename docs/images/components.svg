<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">Folio ownership and execution architecture</title>
<desc id="desc">Project-local panel tasks capture immutable inputs. Application services own shared course materials and credentials. Validated results authorize writes. Domain operations use bounded HTTP and read-only staged Git capture.</desc>
<style>:root{color-scheme:light dark}svg{background:#f7f8fb;color:#172033;font-family:system-ui,sans-serif}.box{fill:#fff;stroke:#8092aa;stroke-width:1.5}.arrow{fill:none;stroke:#64748b;stroke-width:2}.title{fill:currentColor;font-size:17px;font-weight:650}.detail{fill:currentColor;font-size:13px}.caption{fill:currentColor;font-size:14px;font-weight:650}@media(prefers-color-scheme:dark){svg{background:#101722;color:#e1e8f3}.box{fill:#1b2738;stroke:#7793b5}.arrow{stroke:#9dafc6}}</style>
